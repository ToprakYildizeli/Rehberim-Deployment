{% extends "accounts/base.html" %}

{% block title %}Kayıt · Rehberim{% endblock %}

{% block content %}
    <h1>Rehber Kaydı</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Kayıt Ol</button>
    </form>

    <p>Zaten hesabın var mı? <a href="{% url 'login' %}">Giriş yap</a></p>
{% endblock %}
