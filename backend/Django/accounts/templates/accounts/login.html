{% extends "accounts/base.html" %}

{% block title %}Giriş · Rehberim{% endblock %}

{% block content %}
    <h1>Rehber Girişi</h1>

    {% if form.errors %}
        <p style="color: #c0392b;">Kullanıcı adı veya şifre hatalı.</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Giriş Yap</button>
    </form>

    <p><a href="{% url 'password_reset' %}">Şifreni mi unuttun?</a></p>
    <p>Hesabın yok mu? <a href="{% url 'register' %}">Kayıt ol</a></p>
{% endblock %}
