{% extends "accounts/base.html" %}

{% block title %}Şifre Sıfırla · Rehberim{% endblock %}

{% block content %}
    <h1>Şifre Sıfırlama</h1>
    <p>Hesabına bağlı e-posta adresini gir; sıfırlama bağlantısı gönderelim.</p>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Bağlantı Gönder</button>
    </form>

    <p><a href="{% url 'login' %}">Girişe dön</a></p>
{% endblock %}
